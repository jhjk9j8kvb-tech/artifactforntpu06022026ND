    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --cyber-blue: #00f3ff;
            --cyber-dark: #05080f;
            --cyber-alert: #ff003c;
            --cyber-warning: #ffb700;
            --cyber-success: #00ff66;
            --cyber-panel: rgba(10, 16, 28, 0.95);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--cyber-dark);
            color: #e0e7ff;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 35px 35px;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: filter 0.1s;
        }

        .mono-font { font-family: 'Share Tech Mono', monospace; }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: -1; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.5;
        }

        /* 畫面故障震動特效 */
        .system-glitch {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            filter: drop-shadow(4px 0px 0px rgba(255,0,60,0.8)) drop-shadow(-4px 0px 0px rgba(0,243,255,0.8));
        }

        @keyframes screenShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }

            background: var(--cyber-panel);

            position: relative;

            background: rgba(0, 243, 255, 0.05); color: var(--cyber-blue);

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }

        .timer-bar { height: 6px; background: #374151; width: 100%; overflow: hidden; border-radius: 3px; margin-bottom: 1rem; }

        .speech-bubble { position: relative; background: #e5e7eb; color: #111827; border-radius: .4em; padding: 1rem; font-weight: bold; }

        /* ==========================================
           AUDIO ENGINE (Web Audio API Synthesizer)
           ========================================== */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq, type, duration, vol) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playType() { playBeep(1200, 'square', 0.05, 0.02); }
        function playError() { playBeep(150, 'sawtooth', 0.6, 0.15); playBeep(100, 'square', 0.6, 0.15); }
        function playSuccess() { playBeep(600, 'sine', 0.1, 0.05); setTimeout(()=>playBeep(800, 'sine', 0.2, 0.05), 100); }
        function playAlert() { playBeep(400, 'triangle', 0.2, 0.1); setTimeout(()=>playBeep(400, 'triangle', 0.2, 0.1), 250); }

        let noiseNode, noiseGain;
        function playWhiteNoise() {
            if(!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.05;
            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start(0);
        }
        function stopWhiteNoise() {
            if(noiseNode) { noiseNode.stop(); noiseNode.disconnect(); }
        }

        /* Typewriter Effect Function - Robust DOM Version */
        let typeTimeouts = [];
        function clearTyping() { typeTimeouts.forEach(clearTimeout); typeTimeouts = []; }

        async function typeText(element, htmlString, speed = 20, clear = true) {
            if (clear) element.innerHTML = '';
            
            let temp = document.createElement('div');
            temp.innerHTML = htmlString.replace(/\n/g, '<br>');
            
            async function typeNode(node, parent) {
                if (node.nodeType === 3) { // TEXT_NODE
                    let text = node.nodeValue;
                    for (let i = 0; i < text.length; i++) {
                        parent.appendChild(document.createTextNode(text[i]));
                        if (text[i] !== ' ' && i % 3 === 0) playType();
                        // Scroll to bottom if it's a terminal
                        if (element.classList.contains('terminal-box')) element.scrollTop = element.scrollHeight;
                        await new Promise(r => { let t = setTimeout(r, speed); typeTimeouts.push(t); });
                    }
                } else if (node.nodeType === 1) { // ELEMENT_NODE
                    if (node.tagName.toLowerCase() === 'br') {
                        parent.appendChild(document.createElement('br'));
                    } else {
                        let newEl = document.createElement(node.tagName);
                        for (let attr of node.attributes) newEl.setAttribute(attr.name, attr.value);
                        parent.appendChild(newEl);
                        for (let child of node.childNodes) {
                            await typeNode(child, newEl);
                        }
                    }
                }
            }
            
            for (let child of temp.childNodes) {
                await typeNode(child, element);
            }
        }

                }).join('');
                let nodesHtml = stage.nodes.map(n => `
                    <g class="net-group cursor-pointer" onclick="handleNetworkNode(this, ${n.isTarget}, '${n.msg ? n.msg.replace(/'/g, "\\'") : ''}')">
                        <circle cx="${n.cx}" cy="${n.cy}" r="6" class="net-node" />
                        <text x="${n.cx}" y="${n.cy + 1.5}" text-anchor="middle" fill="#fff" font-size="4" font-family="monospace" pointer-events="none">${n.id}</text>
                    </g>`).join('');
                
                html += `
                <div class="bg-gray-900 p-6 rounded border border-gray-700 shadow-inner max-w-3xl mx-auto w-full">
                    <div class="relative w-full aspect-video bg-black rounded border border-gray-800 shadow-inner overflow-hidden">
                        <svg viewBox="0 0 100 100" class="w-full h-full absolute inset-0">
                            <defs>
                                <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="14" refY="4" orient="auto" markerUnits="userSpaceOnUse">
                                    <polygon points="0 0, 8 4, 0 8" fill="var(--cyber-blue)" />
                                </marker>
                            </defs>
                            ${edgesHtml}${nodesHtml}
                        </svg>
                    </div>
                    <div id="net-result" class="mt-6 text-center"></div>
                </div>`;
            }
            else if (stage.type === 'hex') {
                let hexRows = stage.hexLines.map(line => `<div class="hex-row" onclick="handleHexClick(this, ${line.isMalicious || false}, '${line.msg.replace(/'/g, "\\'")}')"><div class="hex-hex font-mono">${line.hex}</div><div class="hex-ascii font-mono">${line.ascii.replace(/</g, "&lt;")}</div></div>`).join('');
                html += `<div class="bg-gray-900 p-6 rounded border border-gray-700 shadow-inner w-full"><div class="bg-black border border-gray-800 rounded p-4 h-80 overflow-y-auto mb-6 shadow-inner">${hexRows}</div><div id="hex-result" class="hidden"></div></div>`;
            }
            else if (stage.type === 'allocation') {
                let slidersHtml = stage.targets.map((t, i) => `<div class="mb-4"><div class="flex justify-between mb-1"><label class="text-[var(--cyber-blue)] font-bold">${t}</label><span id="val-${i}" class="font-mono text-gray-300">0</span></div><input type="range" class="alloc-slider" min="0" max="${stage.totalPoints}" value="0" oninput="updateAllocation()"></div>`).join('');
                html += `<div class="bg-gray-900 p-6 rounded border border-gray-700 shadow-inner max-w-2xl mx-auto w-full"><div class="mb-6 p-4 bg-black border border-gray-800 rounded"><p class="text-gray-300 font-bold mb-2">可用單位總數：<span id="alloc-total" class="font-mono text-[var(--cyber-alert)]">0</span> / ${stage.totalPoints}</p></div>${slidersHtml}<div class="text-right mt-6"><button id="btn-verify-alloc" onclick="verifyAllocation('${JSON.stringify(stage.rules)}', '${stage.ruleMsg.replace(/'/g, "\\'")}')" class="btn-cyber px-8 py-3" disabled>確認調度部署 (DEPLOY)</button></div></div>`;
            }
            else if (stage.type === 'traceroute') {
                let nodesHtml = stage.hops.map(h => `<div class="trace-node bg-black hover:bg-gray-800 rounded mb-2 border border-gray-800 font-mono text-sm flex justify-between shadow-sm" onclick="handleTraceClick(this, ${h.isTarget}, '${h.msg.replace(/'/g, "\\'")}')"><span><span class="text-gray-500 mr-2">> hop:</span><span class="text-[var(--cyber-blue)]">${h.ip}</span></span><span>${h.ms} ms</span><span class="text-gray-500">${h.loc}</span></div>`).join('');
                html += `<div class="bg-gray-900 p-6 rounded border border-gray-700 shadow-inner max-w-3xl mx-auto w-full"><div class="bg-black p-4 rounded border border-gray-800 mb-6 font-mono text-[var(--cyber-success)] shadow-inner" id="trace-term"></div>${nodesHtml}<div id="trace-result" class="mt-6 text-center hidden"></div></div>`;
            }
            else if (stage.type === 'ending') {
                playSuccess();
                let evalText = state.sri >= 80 ? '<span class="text-[var(--cyber-success)]">S級卓越防禦。社會韌性展露無遺。</span>' : (state.sri >= 50 ? '<span class="text-[var(--cyber-blue)]">A級戰術勝利。信任修復仍需時間。</span>' : '<span class="text-[var(--cyber-alert)]">B級慘勝。社會信任受到重創。</span>');
                html = `<div class="flex-1 flex flex-col justify-center items-center text-center"><h2 class="text-5xl font-bold text-white mb-2 glitch" data-text="演習結束 END OF EXERCISE">演習結束 END OF EXERCISE</h2><div class="bg-gray-900 border border-[var(--cyber-blue)] p-10 rounded max-w-2xl w-full text-left mt-8 shadow-[0_0_30px_rgba(0,243,255,0.2)]"><div class="text-4xl font-bold text-[var(--cyber-blue)] mb-6 mono-font border-b border-gray-700 pb-4">最終 SRI: ${state.sri}%</div><p class="text-xl leading-relaxed">${evalText}</p></div><button onclick="location.reload()" class="btn-cyber px-8 py-3 mt-10 font-bold text-lg">重啟戰情室 (REBOOT)</button></div>`;
            }

            elements.container.innerHTML = html;

            // Post-render actions (Typewriter triggers)
            if (stage.type === 'osint') {
                typeText(document.getElementById('osint-terminal'), '> 初始化情報網...\n> 準備接受查詢指令...', 20, false);
            }
            if (stage.type === 'traceroute') {
                typeText(document.getElementById('trace-term'), 'traceroute 114.32.x.x\ntracing route to target, max 30 hops...', 20, false);
            }
            
            // Timer Attack Logic
            if (stage.timeLimit) {
                let timeLeft = stage.timeLimit * 10; // 100ms intervals
                const fill = document.getElementById('stage-timer-fill');
                state.timerInterval = setInterval(() => {
                    timeLeft--;
                    fill.style.width = `${(timeLeft / (stage.timeLimit * 10)) * 100}%`;
                    if (timeLeft <= 0) {
                        clearInterval(state.timerInterval);
                        applyPenalty(15, "未在時限內做出決斷，危機已實體化擴散！", nextStage);
                    }
                }, 100);
            }
        }

        /* ==========================================
           HANDLERS
           ========================================== */
        
        window.handleTriage = function(el, isCorrect, reason) { 
            clearInterval(state.timerInterval);
            document.querySelectorAll('.triage-card').forEach(c => c.style.pointerEvents = 'none'); 
            el.classList.add('selected'); 
            if(isCorrect) { 
                playSuccess();
                showAlert('檢傷正確', `<span class="text-[var(--cyber-success)]">${reason}</span>`, () => { document.getElementById('triage-action').classList.remove('hidden'); }); 
            } else { 
                applyPenalty(10, `錯誤的優先級別判斷。<br>${reason}`, () => { document.getElementById('triage-action').classList.remove('hidden'); }); 
            } 
        };
        
        window.handleMCQ = function(isCorrect, reason) { 
            if(isCorrect) { playSuccess(); showAlert('分析正確', `<span class="text-[var(--cyber-success)]">${reason}</span>`, nextStage); } 
            else { applyPenalty(10, `分析錯誤。<br>${reason}`); } 
        };
        
        window.handleWordClick = function(el, required) { 
            if(el.classList.contains('revealed-trap') || el.classList.contains('revealed-distractor')) return; 
            el.classList.toggle('selected'); playType();
            let count = document.querySelectorAll('.word-node.selected').length; 
            document.getElementById('trap-counter').innerText = count; 
            document.getElementById('btn-verify-semantic').disabled = (count !== required); 
        };
        
        window.verifySemantic = async function(required) { 
            const selected = document.querySelectorAll('.word-node.selected'); 
            const log = document.getElementById('semantic-log'); 
            let allCorrect = true; 
            log.innerHTML = '';
            
            for(let el of selected) {
                el.classList.remove('selected'); 
                if(el.dataset.type === 'trap') { 
                    el.classList.add('revealed-trap'); 
                    playSuccess();
                    log.innerHTML += `<div class="mb-2 text-[var(--cyber-alert)]">[精準打擊] ${el.dataset.reason}</div>`; 
                } else { 
                    el.classList.add('revealed-distractor'); 
                    playError();
                    log.innerHTML += `<div class="mb-2 text-[var(--cyber-warning)]">[誤判事實] ${el.dataset.reason}</div>`; 
                    allCorrect = false; 
                    if(!state.penaltyActive) { applyPenalty(10, "誤標客觀事實！"); state.penaltyActive = true; } 
                } 
                await new Promise(r => setTimeout(r, 400));
            } 
            log.innerHTML += `<div class="mt-6 text-center"><button onclick="nextStage()" class="btn-cyber px-6 py-2 text-sm">進入下一階段 >></button></div>`; 
            log.scrollTop = log.scrollHeight; 
            document.getElementById('btn-verify-semantic').style.display = 'none'; 
        };
        
        window.handleOsintClick = async function(btn, qId, isTarget, response, required) { 
            btn.disabled = true; btn.classList.add('opacity-50'); 
            const term = document.getElementById('osint-terminal'); 
            
            let queryNode = document.createElement('div');
            queryNode.className = "text-gray-400 mt-2";
            term.appendChild(queryNode);
            await typeText(queryNode, `> 查詢送出...`, 20, false); 
            
            setTimeout(async () => { 
                let resNode = document.createElement('div');
                term.appendChild(resNode);

                if(isTarget) { 
                    playSuccess();
                    resNode.className = "text-[var(--cyber-success)]";
                    await typeText(resNode, `> ${response}`, 20, false);
                    if(!state.osintSet.has(qId)) { 
                        state.osintSet.add(qId); state.osintFound++; 
                        document.getElementById('osint-counter').innerText = state.osintFound; 
                        if(state.osintFound >= required) document.getElementById('btn-next-osint').classList.remove('hidden'); 
                    }
                } else { 
                    playError();
                    resNode.className = "text-[var(--cyber-warning)]";
                    await typeText(resNode, `> ${response}`, 20, false);
                    applyPenalty(5, "查詢無關資料庫。"); 
                } 
                term.scrollTop = term.scrollHeight; 
            }, 400); 
        };
        
        window.updateCbsCount = function(el) { const len = el.value.length; const counter = document.getElementById('char-counter'); counter.innerText = `${len} / 60 字`; counter.classList.toggle('text-[var(--cyber-alert)]', len > 60); };
        window.submitCBS = function() { 
            const text = document.getElementById('cbs-input').value; 
            if(text.trim() === '') return; 
            const stage = campaign[state.idx]; let errors = []; 
            if(text.length > 60) errors.push("字數超過60字。"); 
            if(text.length < 10) errors.push("字數過短。"); 
            let usedForbidden = stage.forbiddenWords.filter(w => text.includes(w)); 
            if(usedForbidden.length > 0) errors.push(`【反作用效應】重複謠言字眼：「${usedForbidden.join('、')}」！`); 
            let hasPositive = stage.requiredWords.some(w => text.includes(w)); 
            if(!hasPositive) errors.push(`未提供明確事實（需包含：${stage.requiredWords.join(' / ')} 等字眼）。`); 
            
            if(errors.length > 0) { applyPenalty(15, errors.join('<br>')); } 
            else { playSuccess(); showAlert('發布成功', '<span class="text-[var(--cyber-success)]">澄清訊息已發送全國。社會恐慌受控。</span>', nextStage); } 
        };

        window.submitPress = function() {
            const text = document.getElementById('press-input').value; 
            if(text.trim() === '') return; 
            const stage = campaign[state.idx]; let errors = []; 
            
            let usedForbidden = stage.forbiddenWords.filter(w => text.includes(w)); 
            if(usedForbidden.length > 0) errors.push(`【反作用效應】您在發言中重複了媒體的負面誘導字眼：「${usedForbidden.join('、')}」！這會為謠言背書！`); 
            let hasPositive = stage.requiredWords.some(w => text.includes(w)); 
            if(!hasPositive) errors.push(`您的發言缺乏正面安定力量（需提到：${stage.requiredWords.join(' / ')} 等關鍵字）。`); 
            
            if(errors.length > 0) { applyPenalty(15, errors.join('<br>')); } 
            else { playSuccess(); showAlert('發言成功', '<span class="text-[var(--cyber-success)]">非常精準的外交/公關辭令！成功將敵方設定的負面對話框架導向正面事實。</span>', nextStage); } 
        }

        window.handlePhishing = function(isFake, reason) { if(isFake) { playSuccess(); showAlert('精準攔截', `<span class="text-[var(--cyber-success)]">${reason}</span>`, nextStage); } else { applyPenalty(10, "誤判官方合法網域為釣魚網站，這會阻斷官方資訊流通！"); } };
        
        window.handleTuning = function(val, target, msg) { 
            document.getElementById('radio-display').innerHTML = `${parseFloat(val).toFixed(1)} <span class="text-xl">MHz</span>`; 
            const noiseEl = document.getElementById('noise-text'); const btn = document.getElementById('btn-intercept'); 
            if(Math.abs(val - target) < 0.2) { 
                noiseEl.innerHTML = msg; noiseEl.className = "text-[var(--cyber-alert)] font-bold text-lg w-full text-left leading-tight"; 
                btn.classList.remove('hidden'); 
                if(noiseGain) noiseGain.gain.value = 0.005; // lower noise volume
            } else { 
                noiseEl.className = "text-gray-500 font-mono text-lg opacity-80 break-all w-full text-left leading-tight"; 
                btn.classList.add('hidden'); 
                if(noiseGain) noiseGain.gain.value = 0.05;
            } 
        };
        
        window.startNoiseLoop = function(target) { 
            clearInterval(noiseInterval); 
            noiseInterval = setInterval(() => { 
                if(campaign[state.idx].type !== 'tuning') { clearInterval(noiseInterval); return; } 
                const val = document.getElementById('freq-slider').value; 
                if(Math.abs(val - target) >= 0.2) { 
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"; let noise = ""; 
                    for(let i=0; i<150; i++) noise += chars.charAt(Math.floor(Math.random() * chars.length)); 
                    document.getElementById('noise-text').innerText = noise; 
                } 
            }, 100); 
        };
        
        window.handleSequence = function(el, id, total) { 
            if(state.seqArr.includes(id)) return; playType();
            state.seqArr.push(id); const badge = el.querySelector('.seq-badge'); 
            badge.innerText = state.seqArr.length; badge.classList.remove('bg-black', 'border-gray-600'); badge.classList.add('bg-[var(--cyber-blue)]', 'text-black', 'border-[var(--cyber-blue)]'); 
            if(state.seqArr.length === total) { 
                let isCorrect = state.seqArr.every((val, index) => val === index + 1); 
                if(isCorrect) { playSuccess(); showAlert('邏輯重構成功', '<span class="text-[var(--cyber-success)]">完美的證偽邏輯！利用時間軸矛盾徹底擊破謠言。</span>', nextStage); } 
                else { applyPenalty(10, "邏輯鏈錯誤。錯誤的前後果關係無法說服民眾。請重新排列。"); resetSequence(); } 
            } 
        };
        
        window.resetSequence = function() { state.seqArr = []; document.querySelectorAll('.seq-item').forEach(el => { const badge = el.querySelector('.seq-badge'); badge.innerText = '?'; badge.className = 'seq-badge w-8 h-8 rounded border border-gray-600 flex items-center justify-center font-bold mr-4 bg-black text-white'; }); };
        
        window.handleCipher = function(plainText) { 
            const btn = document.getElementById('btn-decode'); const res = document.getElementById('cipher-result'); const nextBtn = document.getElementById('btn-cipher-next'); 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 解碼器運行中...'; btn.disabled = true; 
            setTimeout(() => { playSuccess(); btn.style.display = 'none'; res.innerHTML = plainText; res.classList.remove('hidden'); nextBtn.classList.remove('hidden'); }, 1500); 
        };

        window.submitBuilder = function(correctMsg) {
            const selects = document.querySelectorAll('.builder-select');
            let allFilled = true; let allCorrect = true;
            selects.forEach(s => { if(s.value === '') allFilled = false; if(s.value === 'wrong') allCorrect = false; });
            if(!allFilled) { showAlert('警告', '請完成所有模組選擇。'); return; }
            if(allCorrect) { playSuccess(); showAlert('核發成功', `<span class="text-[var(--cyber-success)]">${correctMsg}</span>`, nextStage); } 
            else { applyPenalty(15, "您的聲明中包含了不當字眼或錯誤的論述框架，這會導致反作用效應！"); }
        };

        window.handleNetworkNode = function(el, isTarget, msg) {
            // 改為選取底下的 circle 或者自己本身
            let circle = el.querySelector('circle') || el;
            if(circle.classList.contains('eliminated')) return;
            
            if(isTarget) {
                circle.classList.add('eliminated'); playSuccess();
                document.getElementById('net-result').innerHTML = `<p class="text-[var(--cyber-success)] font-bold text-lg mb-4">${msg}</p><button onclick="nextStage()" class="btn-cyber px-6 py-2">進入下一步 >></button>`;
            } else { applyPenalty(10, "誤判！您封鎖了僅負責轉推的邊緣節點，C2 核心帳號依然在運作！"); }
        };

        window.handleHexClick = function(el, isTarget, msg) {
            if(isTarget) {
                playSuccess();
                el.style.background = 'rgba(0, 255, 102, 0.2)'; el.style.border = '1px solid var(--cyber-success)';
                document.getElementById('hex-result').innerHTML = `<p class="text-[var(--cyber-success)] font-bold text-lg mb-4">${msg}</p><button onclick="nextStage()" class="btn-cyber px-6 py-2">進入下一步 >></button>`;
                document.getElementById('hex-result').classList.remove('hidden');
            } else { applyPenalty(5, `鑑識錯誤。<br>${msg}`); }
        };

        window.updateAllocation = function() {
            let total = 0; const sliders = document.querySelectorAll('.alloc-slider');
            sliders.forEach((s, i) => { const val = parseInt(s.value); total += val; document.getElementById(`val-${i}`).innerText = val; });
            const totalEl = document.getElementById('alloc-total');
            totalEl.innerText = total;
            totalEl.className = total === campaign[state.idx].totalPoints ? 'font-mono text-[var(--cyber-success)] font-bold' : 'font-mono text-[var(--cyber-alert)] font-bold';
            document.getElementById('btn-verify-alloc').disabled = (total !== campaign[state.idx].totalPoints);
        };

        window.verifyAllocation = function(rulesStr, successMsg) {
            const rules = JSON.parse(rulesStr); const vals = Array.from(document.querySelectorAll('.alloc-slider')).map(s => parseInt(s.value));
            let pass = true; for(let i=0; i<rules.length; i++) { if(vals[i] < rules[i]) pass = false; }
            if(pass) { playSuccess(); showAlert('調度成功', `<span class="text-[var(--cyber-success)]">${successMsg}</span>`, nextStage); } 
            else { applyPenalty(15, "資源調度失敗。關鍵單位的人力低於最低防禦閾值，導致防線被突破！"); }
        };

        window.handleTraceClick = function(el, isTarget, msg) {
            if(isTarget) {
                playSuccess();
                el.style.borderColor = 'var(--cyber-success)'; el.style.background = 'rgba(0, 255, 102, 0.1)';
                document.getElementById('trace-result').innerHTML = `<p class="text-[var(--cyber-success)] font-bold text-lg mb-4">${msg}</p><button onclick="nextStage()" class="btn-cyber px-6 py-2">進入下一步 >></button>`;
                document.getElementById('trace-result').classList.remove('hidden');
            } else { applyPenalty(5, `追蹤錯誤。<br>${msg}`); }
        };

        // Init
        window.onload = renderStage;

    </script>
</body>
</html>
